<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 계정</title>

    <link rel="stylesheet" href="/frontend/styles/common.css">
    <link rel="stylesheet" href="/frontend/styles/components/header.css">
    <link rel="stylesheet" href="/frontend/styles/components/footer.css">
    <link rel="stylesheet" href="/frontend/styles/pages/account.css">

    <script type="module" src="/frontend/scripts/pages/account.js"></script>
</head>
<body>

<div id="header"></div>

<main id="main">
    <div class="page-container auth-container">

        <!-- 🔹 비로그인 영역 -->
        <section id="login-area">
            <div class="card auth-card">
                <h2 class="auth-title">
                    이메일로<br>
                    로그인해 주세요
                </h2>

                <form id="login-form" class="auth-form">
                    <label>
                        <span class="title">이메일(아이디)</span>
                        <input type="email" id="email" required>
                    </label>

                    <label>
                        <span class="title">비밀번호</span>
                        <input type="password" id="password" required>
                    </label>

                    <button type="submit" class="btn-primary">로그인하기</button>
                    <a href="/frontend/pages/signup.html" class="btn-secondary">
                        이메일로 가입하기
                    </a>
                </form>

                <div class="auth-links">
                    <a href="#">아이디 찾기</a>
                    <span>|</span>
                    <a href="#">비밀번호 재설정</a>
                </div>
            </div>
        </section>

        <!-- 🔹 로그인 후 영역 -->
        <section id="profile-area" hidden>
            <div class="account-layout card">

                <!-- 사용자 정보 -->
                <aside class="account-side">
                    <h3 class="side-title">
                        <span>내 정보</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                            <path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/>
                        </svg>
                    </h3>
                    <p><strong>이메일</strong><br>
                        <span id="user-email"></span>
                    </p>
                    <p><strong>이름</strong><br>
                        <span id="user-name"></span>
                    </p>
                    <div class="-flex-stretch"></div>
                    <button id="logout-btn" class="btn-primary">
                        로그아웃
                    </button>
                    <button id="delete-btn" class="btn-delete">
                        회원탈퇴
                    </button>
                </aside>

                <!-- 예약 정보  -->
                <section class="account-main">
                    <section id="reservation-content" class="card">

                        <nav class="reservation-tabs">
                            <label class="tab-label">
                                <input checked type="radio" name="reservation-tab" data-status="UPCOMING" class="tab">
                                <span>이용 전</span>
                            </label>
                            <label class="tab-label">
                                <input type="radio" name="reservation-tab" data-status="COMPLETED" class="tab">
                                <span>이용 후</span>
                            </label>
                            <label class="tab-label">
                                <input type="radio" name="reservation-tab" data-status="CANCELED" class="tab">
                                <span>취소 됨</span>
                            </label>
                        </nav>

                        <section class="reservation-section" data-section="UPCOMING">
                            <div class="reservation-list"></div>
                        </section>

                        <section class="reservation-section hidden" data-section="COMPLETED">
                            <div class="reservation-list"></div>
                        </section>

                        <section class="reservation-section hidden" data-section="CANCELED">
                            <div class="reservation-list"></div>
                        </section>

                    </section>
                </section>
            </div>
        </section>

    </div>
</main>

<!-- 리뷰 작성 모달 -->
<div id="review-modal" class="review-modal hidden" aria-hidden="true">
    <div class="review-modal__backdrop" data-role="close-review-modal"></div>
    <section class="review-modal__panel" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
        <h3 id="review-modal-title">리뷰 작성</h3>
        <form id="review-form" class="review-form">
            <input type="hidden" id="review-reservation-id">

            <label for="review-rating">별점 (1~5)</label>
            <select id="review-rating" required>
                <option value="5">5점</option>
                <option value="4">4점</option>
                <option value="3">3점</option>
                <option value="2">2점</option>
                <option value="1">1점</option>
            </select>

            <label for="review-content">내용</label>
            <textarea id="review-content" rows="5" maxlength="1000" placeholder="숙소 이용 경험을 작성해주세요." required></textarea>

            <div class="review-modal__actions">
                <button type="button" id="review-cancel-btn" class="btn-secondary">닫기</button>
                <button type="submit" class="btn-primary">등록</button>
            </div>
        </form>
    </section>
</div>


<div id="footer"></div>

</body>
</html>
