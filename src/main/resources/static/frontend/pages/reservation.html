<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예약하기</title>

    <link rel="stylesheet" href="/frontend/styles/common.css">
    <link rel="stylesheet" href="/frontend/styles/components/header.css">
    <link rel="stylesheet" href="/frontend/styles/components/footer.css">
    <link rel="stylesheet" href="/frontend/styles/pages/reservation.css">

    <script type="module" src="/frontend/scripts/pages/reservation.js"></script>
</head>
<body>

<div id="header"></div>

<main class="reservation-page">
    <section class="reservation-container">

        <!-- 방 정보 -->
        <div class="card room-summary">
            <h2 class="room-name">스탠다드 더블룸</h2>
            <p class="accommodation-name">북플로우 호텔 강남</p>
            <p class="room-price">₩90,000 / 1박</p>
        </div>

        <!-- 예약 정보 입력 -->
        <div class="card reservation-form">

            <!-- 날짜 -->
            <div class="form-group">
                <label>숙박 날짜</label>
                <div class="date-range">
                    <input type="date" id="checkIn">
                    <span>~</span>
                    <input type="date" id="checkOut">
                </div>
            </div>

            <!-- 인원 -->
            <div class="form-group">
                <label>인원</label>
                <p class="guest-count">2명</p>
            </div>

            <!-- 가격 -->
            <div class="price-summary">
                <span>총 결제 금액</span>
                <strong>₩180,000</strong>
            </div>

            <!-- 예약 버튼 -->
            <button id="reserve-btn" class="btn-primary">
                예약 요청
            </button>

        </div>

    </section>
</main>

<div id="footer"></div>

</body>
</html>
